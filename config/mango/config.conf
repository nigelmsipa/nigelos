# MangoWC config - keybindings ported from Niri

# Cursor
cursor_theme=Bibata-Modern-Ice
cursor_size=24

# Disable hot corner overview trigger
enable_hotarea=0

# Click to focus, not hover
sloppyfocus=0

# Transient/file apps float centered
windowrule=isfloating:1,appid:^org\.gnome\.Nautilus$

# Autostart
exec-once=/home/nigel/.config/scripts/start-audio-stack.sh
exec-once=waybar
exec-once=swaybg -i /home/nigel/Pictures/Green.png -m fill
exec-once=mako

# Animations (Hyprland-like feel)
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
fadein_begin_opacity=0.0
fadeout_begin_opacity=1.0
zoom_initial_ratio=0.85
zoom_end_ratio=1.0
animation_duration_open=400
animation_duration_close=320
animation_duration_move=430
animation_duration_tag=400
# Hyprland default bezier (myBezier) — slight overshoot spring
animation_curve_open=0.05,0.9,0.1,1.05
animation_curve_close=0.05,0.9,0.1,1.05
animation_curve_move=0.05,0.9,0.1,1.05
animation_curve_tag=0.05,0.9,0.1,1.05

# Gaps (inner/outer horizontal/vertical — matches niri gaps=16)
gappih=16
gappiv=16
gappoh=16
gappov=16

# Border
borderpx=4
focuscolor=0x7fc8ffff
bordercolor=0x505050ff

# Scroller layout (horizontal infinite scroll, like niri)
tagrule=id:1,layout_name:scroller
tagrule=id:2,layout_name:scroller
tagrule=id:3,layout_name:scroller
tagrule=id:4,layout_name:scroller
tagrule=id:5,layout_name:scroller
tagrule=id:6,layout_name:scroller
tagrule=id:7,layout_name:scroller
tagrule=id:8,layout_name:scroller
tagrule=id:9,layout_name:scroller

# Scroller behaviour — match niri's center-focused-column "always"
scroller_focus_center=1
scroller_prefer_center=1
scroller_proportion_preset=0.33,0.5,0.67

# Apps
bind=ALT,Return,spawn,ghostty
bind=ALT,space,spawn_shell,fuzzel
bind=ALT,e,spawn,nautilus
bind=ALT,b,spawn_shell,ghostty -e bluetuith
bind=ALT,a,spawn_shell,ghostty -e wiremix
bind=ALT,c,spawn_shell,wtype -M ctrl -k c
bind=ALT,v,spawn_shell,wtype -M ctrl -k v
bind=SUPER+ALT,l,spawn,swaylock

# Close / Quit
bind=ALT,q,killclient
bind=ALT+SHIFT,e,quit
bind=CTRL+ALT,Delete,quit

# Focus navigation
bind=ALT,h,focusdir,left
bind=ALT,j,focusdir,down
bind=ALT,k,focusdir,up
bind=ALT,l,focusdir,right
bind=ALT,Left,focusdir,left
bind=ALT,Down,focusdir,down
bind=ALT,Up,focusdir,up
bind=ALT,Right,focusdir,right

# Move windows
bind=ALT+CTRL,h,exchange_client,left
bind=ALT+CTRL,j,exchange_client,down
bind=ALT+CTRL,k,exchange_client,up
bind=ALT+CTRL,l,exchange_client,right
bind=ALT+CTRL,Left,exchange_client,left
bind=ALT+CTRL,Down,exchange_client,down
bind=ALT+CTRL,Up,exchange_client,up
bind=ALT+CTRL,Right,exchange_client,right

# Monitor focus
bind=ALT+SHIFT,h,focusmon,left
bind=ALT+SHIFT,j,focusmon,down
bind=ALT+SHIFT,k,focusmon,up
bind=ALT+SHIFT,l,focusmon,right
bind=ALT+SHIFT,Left,focusmon,left
bind=ALT+SHIFT,Down,focusmon,down
bind=ALT+SHIFT,Up,focusmon,up
bind=ALT+SHIFT,Right,focusmon,right

# Move window to monitor
bind=ALT+SHIFT+CTRL,h,tagmon,left
bind=ALT+SHIFT+CTRL,j,tagmon,down
bind=ALT+SHIFT+CTRL,k,tagmon,up
bind=ALT+SHIFT+CTRL,l,tagmon,right
bind=ALT+SHIFT+CTRL,Left,tagmon,left
bind=ALT+SHIFT+CTRL,Down,tagmon,down
bind=ALT+SHIFT+CTRL,Up,tagmon,up
bind=ALT+SHIFT+CTRL,Right,tagmon,right

# Tags/Workspaces
# Alt+N = view tag
bind=ALT,1,view,1
bind=ALT,2,view,2
bind=ALT,3,view,3
bind=ALT,4,view,4
bind=ALT,5,view,5
bind=ALT,6,view,6
bind=ALT,7,view,7
bind=ALT,8,view,8
bind=ALT,9,view,9

# Alt+Shift+N = move window to tag
bind=ALT+SHIFT,1,tag,1
bind=ALT+SHIFT,2,tag,2
bind=ALT+SHIFT,3,tag,3
bind=ALT+SHIFT,4,tag,4
bind=ALT+SHIFT,5,tag,5
bind=ALT+SHIFT,6,tag,6
bind=ALT+SHIFT,7,tag,7
bind=ALT+SHIFT,8,tag,8
bind=ALT+SHIFT,9,tag,9

# Window management
bind=ALT,f,togglefullscreen
bind=ALT,m,togglemaximizescreen
bind=ALT+SHIFT,t,togglefloating
bind=ALT,r,switch_proportion_preset
bind=ALT+SHIFT,c,centerwin

# Resize
bind=ALT,minus,setmfact,-0.05
bind=ALT,equal,setmfact,+0.05

# Layout
bind=ALT+CTRL,space,switch_layout

# Overview
bind=ALT,o,toggleoverview

# Volume
bindl=NONE,XF86AudioRaiseVolume,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1+ -l 1.0
bindl=NONE,XF86AudioLowerVolume,spawn_shell,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1-
bindl=NONE,XF86AudioMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn_shell,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Media
bindl=NONE,XF86AudioPlay,spawn_shell,playerctl play-pause
bindl=NONE,XF86AudioStop,spawn_shell,playerctl stop
bindl=NONE,XF86AudioPrev,spawn_shell,playerctl previous
bindl=NONE,XF86AudioNext,spawn_shell,playerctl next

# Brightness
bindl=NONE,XF86MonBrightnessUp,spawn_shell,brightnessctl --class=backlight set +10%
bindl=NONE,XF86MonBrightnessDown,spawn_shell,brightnessctl --class=backlight set 10%-

# Screenshot
bind=NONE,Print,spawn_shell,grim ~/Pictures/Screenshots/screenshot-$(date +%Y-%m-%d_%H-%M-%S).png
bind=CTRL,Print,spawn_shell,grim -g "$(slurp)" ~/Pictures/Screenshots/screenshot-$(date +%Y-%m-%d_%H-%M-%S).png

# Reload config
bind=ALT+CTRL,r,reload_config
